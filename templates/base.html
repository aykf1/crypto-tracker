<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Kripto Takip Platformu{% endblock %}</title>
    <!-- Bootstrap 5 CSS (Dark theme via data-bs-theme) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
        }
        .navbar {
            background-color: #161b22 !important;
            border-bottom: 1px solid #30363d;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            color: #c9d1d9;
        }
        .text-positive { color: #2ea043; }
        .text-negative { color: #f85149; }
        .table-dark {
            --bs-table-bg: #161b22;
            --bs-table-border-color: #30363d;
            color: #c9d1d9;
        }
        .table-hover tbody tr:hover {
            color: #ffffff;
            background-color: #21262d;
        }
        .coin-icon {
            width: 30px;
            height: 30px;
            object-fit: cover;
            border-radius: 50%;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark mb-4 shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-info" href="{{ url_for('index') }}">
            <i class="bi bi-currency-bitcoin"></i> Kripto Takip
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="{{ url_for('index') }}">Piyasa</a>
                </li>
            </ul>
            <form class="d-flex" action="{{ url_for('search') }}" method="GET">
                <input class="form-control me-2 bg-dark text-light border-secondary" type="search" placeholder="Coin Ara (örn: btc)" aria-label="Search" name="q" value="{{ query if query else '' }}">
                <button class="btn btn-outline-info" type="submit">Ara</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mb-5">
    {% block content %}{% endblock %}
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
